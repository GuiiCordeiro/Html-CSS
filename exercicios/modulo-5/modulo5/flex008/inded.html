<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            background-color: antiquewhite;
            display: flex;
            flex-flow: row wrap;
            align-items: start;
            height: 500px;
            
        }

        div.item{
            background-color: rgb(120, 211, 127);
            border: 1px solid black;
            padding: 20px;
        }

        div#i1{
            align-self: auto;
        }
        div#i2{
            align-self: flex-end;
        }
        div#i3{
            align-self: center;
        }
        div#i4{
            align-self: stretch;
        }
        div#i5{
            
        }
        div#i6{
            align-self: center;
        }
        div#i7{
            align-self: flex-end;
        }

    </style>    
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">F</div>
        <div class="item" id="i6">G</div>
        <div class="item" id="i7">H</div>

    </div>
</body>
</html>
