<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
       .cnome{
        background-color: aqua;
       }
       .cgrupo{
        background-color: blue;
       }
        caption{
            font-size: 2em;
            font-weight: bold;
        }
        table{
            border-collapse: collapse;
            width: 500px;
        }
        td, th{
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="3">
           
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>55</td>
            <td>Jornalista</td>
        </tr>
         <tr>
            <td>Carlos</td>
            <td>M</td>
            <td>33</td>
            <td>Médico</td>
        </tr>
         <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>25</td>
            <td>Professor</td>
        </tr>
         <tr>
            <td>Neymar</td>
            <td>M</td>
            <td>33</td>
            <td>Jogador</td>
        </tr>
         <tr>
            <td>Lucia</td>
            <td>F</td>
            <td>65</td>
            <td>Programadora</td>
        </tr>
         <tr>
            <td>Claudia</td>
            <td>F</td>
            <td>41</td>
            <td>Nutricionista</td>
        </tr>
    </table>
</body>
</html>
