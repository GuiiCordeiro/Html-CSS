<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <title>youtube</title>
</head>
<body>
    <header>
        <div class="left">
            <span id="menu" class="material-symbols-outlined">menu</span>
            <a href="https://www.youtube.com/"><img src="images.png" alt="youtube"></a>
        </div>

        <div class="mid">
            <input class="barra" type="text" name="" id="search" placeholder="Search">
            <button id="search"><span    class="material-symbols-outlined">search</span></button>
            <button id="mic"><span class="material-symbols-outlined">mic</span></button>
        </div>

        <div class="right">
            <a id="create" href="#">+ Create</a>
            <span class="material-symbols-outlined">notifications</span>
            <a class="user" href="#">G</a>
        </div>
    </header>
</body>
</html>
