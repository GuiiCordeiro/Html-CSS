<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            background-color: antiquewhite;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: rgb(120, 211, 127);
            border: 1px solid black;
            text-align: center;
            
        }

        div#a{
            /*flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 350px;*/

            flex: 1 1 350px;
        }

        div#b{
            /*flex-shrink: 2;
            flex-grow: 3;
            flex-basis: 350px;*/

            flex: 3 2 350px;
        }

        div#c{
            /*flex-shrink: 0;
            flex-grow: 5;
            flex-basis: 350px;*/

            flex: 5 0 350px;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>
</html>
